# Implantação local ou de homologação do Concilia.
# Antes da primeira subida, os papéis do banco são criados uma vez com ops/db-bootstrap.sh.
# Variáveis vêm do arquivo .env na raiz (copie de .env.example). Em DATABASE_URL e
# MIGRATION_DATABASE_URL, o host deve ser "db", não "localhost".
# Subir: docker compose -f ops/docker-compose.yml up -d --build

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      # Senha do superusuário do PostgreSQL. Defina POSTGRES_PASSWORD no .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: concilia
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d concilia"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Aplica as migrações e encerra. O app só sobe depois que ela termina com sucesso.
  migrate:
    build:
      context: ..
      dockerfile: ops/Dockerfile
    image: concilia:latest
    command: ["node", "apps/api/dist/cli.js", "db:migrate"]
    env_file: ../.env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    image: concilia:latest
    ports:
      - "3000:3000"
    env_file: ../.env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  db-data:
